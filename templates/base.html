<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, rgba(14,165,164,0.12) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(124,58,237,0.12) 0%, transparent 40%),
                        linear-gradient(135deg, #0B0F1A, #0F172A);
            background-attachment: fixed;
            color: #E5E7EB; /* Primary text */
        }
        
        .glow-element {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.8;
            pointer-events: none;
        }

        .glow-teal {
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(34,211,238,0.25), transparent 60%);
        }

        .glow-purple {
            bottom: -10%; right: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(168,85,247,0.25), transparent 60%);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(124,58,237,0.08));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 300ms ease;
        }

        .glass-card.interactive:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px rgba(34,211,238,0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #22D3EE, #A855F7);
            color: white;
            border-radius: 0.75rem;
            font-weight: 500;
            box-shadow: 0 0 20px rgba(168,85,247,0.5);
            transition: all 300ms ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(168,85,247,0.7);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .input-focus:focus-within {
            box-shadow: 0 0 0 2px rgba(34,211,238,0.5);
        }

        .modal-enter {
            animation: modalFadeZoom 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes modalFadeZoom {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .page-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Base scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col page-fade-in">
    <!-- Floating background glows -->
    <div class="glow-element glow-teal"></div>
    <div class="glow-element glow-purple"></div>
    
    {% block content %}{% endblock %}
</body>
</html>
